<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeChrome tab test</title>
<style>
  html { background:#10212a;color:#edf5f5;font:18px/1.6 system-ui; }
  body { margin:0;border:4px solid #6fe2c0;min-height:100vh;box-sizing:border-box; }
  header { padding:4px 12px;background:#6fe2c0;color:#10212a;font:13px/1.7 monospace; }
  main { max-width:640px;margin:auto;padding:48px 28px; }
  h1 { font-size:40px;line-height:1.1; }
  input { display:block;box-sizing:border-box;width:100%;padding:12px;margin:12px 0;font:inherit;background:#1c3540;color:#edf5f5;border:1px solid #46616c;border-radius:6px; }
  button,a { display:inline-block;padding:10px 16px;margin:16px 12px 0 0;font:inherit;border:0;border-radius:6px;background:#6fe2c0;color:#10212a;text-decoration:none; }
</style>
<header>PAGE START · CONTENT SHOULD MEET THE WINDOW EDGE</header>
<main>
  <h1 id="identity"></h1>
  <p>Each tab has the same title. Its draft and click count should survive switching between tabs.</p>
  <label for="draft">Draft for this tab</label><input id="draft" placeholder="Type a draft, switch tabs, then come back">
  <button id="counter">Clicks: 0</button>
  <a href="tabs.html?tab=Link" target="_blank">Open a real tab</a>
  <a href="navigation.html">Navigate this tab</a>
</main>
<script>
  document.querySelector('#identity').textContent='Tab '+(new URLSearchParams(location.search).get('tab')||'A');
  let clicks=0;
  document.querySelector('#counter').onclick=event=>event.target.textContent=`Clicks: ${++clicks}`;
</script>
</html>
